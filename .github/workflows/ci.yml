name: Build & Deploy

on:
  push:
    branches:
      - devops-poc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      WORKER_REPO: ${{ secrets.ECR_WORKER_REPOSITORY }}
      MIGRATION_REPO: ${{ secrets.ECR_MIGRATION_REPOSITORY }}
      IMAGE_TAG: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Backend Image
      # -------------------------
      - name: Build Backend image
        run: |
          docker build -f app.Dockerfile -t $BACKEND_REPO:$IMAGE_TAG .

      - name: Tag Backend image
        run: |
          docker tag \
            $BACKEND_REPO:$IMAGE_TAG \
            ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG

      - name: Push Backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG

      # -------------------------
      # Migration Image
      # -------------------------
      - name: Build Migration image
        run: |
          docker build -f migration.Dockerfile -t $MIGRATION_REPO:$IMAGE_TAG .

      - name: Tag Migration image
        run: |
          docker tag \
            $MIGRATION_REPO:$IMAGE_TAG \
            ${{ steps.login-ecr.outputs.registry }}/$MIGRATION_REPO:$IMAGE_TAG

      - name: Push Migration image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$MIGRATION_REPO:$IMAGE_TAG

      - name: Run Migration Task
        id: migration
        env:
          ACCOUNT_ID: ${{ steps.login-ecr.outputs.registry }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs register-task-definition --cli-input-json file://ecs/task-definition-migration.json
          TASK_ARN=$(aws ecs run-task --cluster migration-cluster --task-definition migration-task --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[subnet-0712c66198e01988d,subnet-08d8d8bbeaaf26378],securityGroups=[sg-0963ca5d5026e71b9]}" --query 'tasks[0].taskArn' --output text)
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
          aws ecs wait tasks-stopped --cluster migration-cluster --tasks $TASK_ARN
          EXIT_CODE=$(aws ecs describe-tasks --cluster migration-cluster --tasks $TASK_ARN --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Deploy Backend
        if: success()
        env:
          ACCOUNT_ID: ${{ steps.login-ecr.outputs.registry }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs register-task-definition --cli-input-json file://ecs/task-definition-backend.json
          aws ecs update-service --cluster backend-cluster --service backend-service --task-definition backend-task --force-new-deployment
