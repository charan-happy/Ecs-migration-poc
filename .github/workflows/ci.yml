name: Build & Deploy

on:
  push:
    branches:
      - develop

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

 deploy:
  runs-on: ubuntu-latest
  needs: build

  env:
    BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPOSITORY }}
    WORKER_REPO: ${{ secrets.ECR_WORKER_REPOSITORY }}
    IMAGE_TAG: latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # -------------------------
    # Backend Image
    # -------------------------
    - name: Build Backend image
      run: |
        docker build -f app.Dockerfile -t $BACKEND_REPO:$IMAGE_TAG .

    - name: Tag Backend image
      run: |
        docker tag \
          $BACKEND_REPO:$IMAGE_TAG \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG

    - name: Push Backend image
      run: |
        docker push \
          ${{ steps.login-ecr.outputs.registry }}/$BACKEND_REPO:$IMAGE_TAG

    # -------------------------
    # Worker Image
    # -------------------------
    - name: Build Worker image
      run: |
        docker build -f worker.Dockerfile -t $WORKER_REPO:$IMAGE_TAG .

    - name: Tag Worker image
      run: |
        docker tag \
          $WORKER_REPO:$IMAGE_TAG \
          ${{ steps.login-ecr.outputs.registry }}/$WORKER_REPO:$IMAGE_TAG

    - name: Push Worker image
      run: |
        docker push \
          ${{ steps.login-ecr.outputs.registry }}/$WORKER_REPO:$IMAGE_TAG

